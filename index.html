<style>
  :root {
    --navy: #023B5B;
    --cream: #F1EFE9;
    --green: #13FF4B;
    --green-soft: #D2FFDC;
    --surface: #FFFFFF;
    --ink: #023B5B;
    --muted: #4F6B7C;
    --line: #C9D2D8;
    --danger: #B3261E;
    --radius: 14px;
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  .top { background: var(--navy); color: var(--cream); padding: 28px 16px 56px; }
  .top > div, main { max-width: 460px; margin: 0 auto; }
  main { padding: 0 16px 48px; margin-top: -36px; }
  h1 {
    font-size: 2rem;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo img { display: block; width: auto; }
  .logo .mascot { height: 60px; }
  .logo .word { height: 24px; }
  .steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; list-style: none; margin: 0 0 14px; padding: 0; }
  .steps li { height: 6px; border-radius: 3px; background: var(--line); }
  .steps li.on { background: var(--navy); }
  .step-count { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .step-title { margin: 0 0 16px; font-size: 1.25rem; font-weight: 700; line-height: 1.25; outline: none; }
  .summary { background: var(--cream); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 16px; font-weight: 600; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px 16px;
  }
  .field { margin-bottom: 16px; }
  label.name, legend {
    display: block;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 6px;
    padding: 0;
  }
  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
  }
  input[type="text"]:focus-visible, input[type="tel"]:focus-visible, input[type="email"]:focus-visible {
    outline: 3px solid var(--green);
    outline-offset: 1px;
    border-color: var(--navy);
  }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }

  /* Age group chips and time chips share the hidden-radio pattern */
  .chips { display: grid; gap: 8px; }
  .chips.ages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .chips.times { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chip { position: relative; }
  .chip input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; margin: 0; cursor: pointer;
  }
  .chip span {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 52px; padding: 6px 8px; text-align: center;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-weight: 700;
  }
  .chip small { font-weight: 500; font-size: 0.8rem; color: var(--muted); }
  .chip input:checked + span {
    background: var(--green);
    border-color: var(--green);
    color: var(--navy);
  }
  .chip input:checked + span small { color: var(--navy); }
  .chip input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
  .chip input:disabled { cursor: not-allowed; }
  .chip input:disabled + span { color: var(--muted); text-decoration: line-through; background: var(--cream); border-color: var(--cream); }
  .chip input:disabled + span small { text-decoration: none; }

  #picker { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; }
  .pick-title { font-weight: 700; font-size: 0.95rem; margin: 0 0 6px; }
  .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cell, .day {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60px; padding: 4px 0; border-radius: 12px;
    font: inherit; font-size: 1.05rem; font-weight: 700; line-height: 1.2;
  }
  .cell small, .day small { font-size: 0.72rem; font-weight: 500; }
  .cell { color: var(--muted); opacity: 0.55; font-weight: 500; }
  .cell.full b { font-weight: 500; text-decoration: line-through; }
  .cell b, .day b { font-weight: inherit; }
  .day { border: 0; cursor: pointer; background: var(--green-soft); color: var(--ink); }
  .day[aria-pressed="true"] { background: var(--green); color: var(--navy); }
  .day:focus-visible, .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .times-title { font-weight: 700; margin: 16px 0 8px; }
  .note { color: var(--muted); margin: 8px 0 0; }

  .agree-set { margin: 0; }
  .agree {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px; margin-top: 8px;
    border: 1.5px solid var(--line); border-radius: var(--radius);
    font-size: 0.9rem; line-height: 1.45; cursor: pointer;
  }
  .agree input {
    appearance: none; -webkit-appearance: none;
    flex: 0 0 24px; width: 24px; height: 24px; margin: 1px 0 0;
    border: 2px solid var(--navy); border-radius: 50%;
    background: var(--surface); cursor: pointer;
  }
  .agree input:checked { background: var(--green); box-shadow: inset 0 0 0 4px var(--surface); }
  .agree input:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .agree:has(input:checked) { border-color: var(--navy); }

  .error { color: var(--danger); font-weight: 600; margin: 12px 0 0; }
  .field-error { color: var(--danger); font-size: 0.875rem; margin: 6px 0 0; }
  .btn {
    width: 100%; height: 54px; margin-top: 18px;
    border: 0; border-radius: var(--radius);
    background: var(--green); color: var(--navy);
    font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer;
  }
  .actions { display: flex; gap: 10px; }
  .actions .btn { width: auto; flex: 1; }
  .actions .btn.back { flex: 0 0 96px; background: var(--surface); border: 1.5px solid var(--navy); }
  .btn[aria-busy="true"] { opacity: 0.7; cursor: progress; }
  .link {
    background: none; border: 0; padding: 0; margin-top: 16px;
    font: inherit; font-weight: 700; color: var(--ink);
    text-decoration: underline; cursor: pointer;
  }
  .demo {
    background: var(--green-soft); border-radius: var(--radius);
    padding: 10px 12px; font-size: 0.875rem; margin-bottom: 16px;
  }
  .done h2 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; }
  .done dl { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  .done dt { color: var(--muted); }
  .done dd { margin: 0; font-weight: 700; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .chip span, .day { transition: background-color 120ms ease, border-color 120ms ease; }
  }
</style>

      <div class="hp" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <section data-step="1">
        <div class="field">
          <label class="name" for="name">Child's Name</label>
          <input id="name" name="name" type="text" autocomplete="off" maxlength="80" required>
          <p class="field-error" id="name-error" hidden></p>
        </div>

        <fieldset>
          <legend>Child's Age</legend>
          <div class="chips ages" id="ages"></div>
          <p class="field-error" id="age-error" hidden></p>
        </fieldset>

        <div class="field">
          <label class="name" for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" required>
          <p class="field-error" id="phone-error" hidden></p>
        </div>

        <div id="picker" hidden aria-live="polite"></div>
        <p class="error" id="slot-error" role="alert" hidden></p>

        <button class="btn" id="next1" type="button">Next</button>
      </section>

      <section data-step="2" hidden>
        <p class="summary" id="summary"></p>

        <div class="field">
          <label class="name" for="email">Email</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <fieldset class="agree-set">
          <legend>Please confirm</legend>
          <label class="agree">
            <input type="checkbox" id="agree-setup">
            <span>My child will join only from a PC/laptop (not mobile) with stable internet, seated at a table and chair not a bed or sofa. 💛 I will accompany my child during class.</span>
          </label>
          <label class="agree">
            <input type="checkbox" id="agree-attend">
            <span>I understand that the teacher is reserving her time for me instead of making evening plans, so I’ll make sure not to miss the class. If I need to reschedule, I’ll inform you at least a day in advance</span>
          </label>
          <p class="field-error" id="agree-error" hidden></p>
        </fieldset>

        <p class="error" id="form-error" role="alert" hidden></p>
        <div class="actions">
          <button class="btn back" id="back2" type="button">Back</button>
          <button class="btn" id="submit" type="submit">Book class</button>
        </div>
      </section>
    </form>

    <section class="done" id="done" hidden tabindex="-1">
      <h2>Class booked</h2>
      <p id="done-text"></p>
      <dl id="done-details"></dl>
      <button class="link" id="again" type="button">Book another class</button>
    </section>
  </div>
</main>

<script>
/* ================= SETTINGS ================= */

// Paste your Google Apps Script web app URL here (ends in /exec).
// While it is empty the page runs in demo mode with sample classes.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydz72oMU1XnmoyAGAXzSgXN5jnDZTL0JzNNUnlCrIWy55yBiIGQEMXlSWtetYtMOiY/exec';

// The radio buttons. Each id must match a group id in Code.gs.
const AGE_GROUPS = [
  { id: '5-6',  label: '5–6',  hint: 'years' },
  { id: '7-8',  label: '7–8',  hint: 'years' },
  { id: '9-10', label: '9–10', hint: 'years' }
];

// The 7-day strip starts from today in this time zone.
const TIMEZONE = 'Asia/Kolkata';
const DAYS_SHOWN = 7;

/* ============================================ */

const $ = (id) => document.getElementById(id);
const state = { slots: null, loading: true, loadError: false, group: null, date: null, time: null, busy: false, step: 1 };
const STEP_TITLES = ["Child's details and class", 'Confirm and book'];

const pad = (n) => String(n).padStart(2, '0');

// The next DAYS_SHOWN dates as 'YYYY-MM-DD', starting today in TIMEZONE.
function nextDays() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).reduce((a, x) => { a[x.type] = x.value; return a; }, {});
  const start = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day));
  const out = [];
  for (let i = 0; i < DAYS_SHOWN; i++) {
    const d = new Date(start + i * 86400000);
    out.push(d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()));
  }
  return out;
}

function weekday(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Intl.DateTimeFormat('en-IN', { weekday: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, d)));
}

function el(tag, attrs, text) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') node.className = attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  if (text != null) node.textContent = text;
  return node;
}

function formatTime(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const suffix = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 === 0 ? 12 : h % 12;
  return hour + ':' + String(m).padStart(2, '0') + ' ' + suffix;
}

function formatDate(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Intl.DateTimeFormat('en-IN', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })
    .format(new Date(Date.UTC(y, m - 1, d)));
}

function spotsText(left) {
  if (left <= 0) return 'Full';
  return left === 1 ? '1 spot left' : left + ' spots left';
}

/* ---------- Availability ---------- */

function demoSlots() {
  const plan = {
    '5-6':  [[6, '10:00'], [0, '10:00']],
    '7-8':  [[6, '11:30'], [0, '11:30'], [3, '17:00']],
    '9-10': [[6, '16:00'], [0, '16:00'], [5, '17:30']]
  };
  const out = {};
  for (const id in plan) {
    out[id] = [];
    nextDays().forEach((date, i) => {
      if (i === 0) return;
      const [y, m, d] = date.split('-').map(Number);
      const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
      plan[id].forEach(([day, time], n) => {
        if (day === dow) out[id].push({ date, time, left: (i + n) % 4 === 0 ? 0 : ((i + n) % 2) + 1 });
      });
    });
  }
  return out;
}

async function loadSlots() {
  state.loading = true;
  state.loadError = false;
  renderPicker();
  try {
    if (!SCRIPT_URL) {
      state.slots = demoSlots();
    } else {
      const res = await fetch(SCRIPT_URL, { method: 'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !data.groups) throw new Error('Bad response');
      state.slots = data.groups;
    }
  } catch (err) {
    state.loadError = true;
  }
  state.loading = false;
  renderPicker();
}

function groupSlots() {
  return (state.slots && state.slots[state.group]) || [];
}

function slotsByDate() {
  const map = {};
  groupSlots().forEach((s) => { (map[s.date] = map[s.date] || []).push(s); });
  return map;
}

/* ---------- Rendering ---------- */

function renderAges() {
  const wrap = $('ages');
  AGE_GROUPS.forEach((g) => {
    const label = el('label', { class: 'chip' });
    const input = el('input', { type: 'radio', name: 'age', value: g.id });
    input.addEventListener('change', () => selectGroup(g.id));
    const span = el('span');
    span.append(document.createTextNode(g.label), el('small', null, g.hint));
    label.append(input, span);
    wrap.append(label);
  });
}

function selectGroup(id) {
  state.group = id;
  state.time = null;
  showError('age-error', '');
  showError('slot-error', '');
  const days = nextDays();
  const open = groupSlots().filter((s) => s.left > 0 && days.includes(s.date)).sort((a, b) => a.date.localeCompare(b.date));
  state.date = open.length ? open[0].date : null;
  renderPicker();
}

function renderPicker() {
  const box = $('picker');
  box.textContent = '';
  if (!state.group) { box.hidden = true; return; }
  box.hidden = false;

  if (state.loading) {
    box.append(el('p', { class: 'note' }, 'Loading classes…'));
    return;
  }
  if (state.loadError) {
    box.append(el('p', { class: 'error' }, "Classes couldn't be loaded. Check your connection and try again."));
    const retry = el('button', { class: 'link', type: 'button' }, 'Try again');
    retry.addEventListener('click', async () => { await loadSlots(); if (state.group) selectGroup(state.group); });
    box.append(retry);
    return;
  }

  const byDate = slotsByDate();
  const days = nextDays();
  box.append(el('p', { class: 'pick-title', id: 'pick-title' }, 'Class day'));

  const strip = el('div', { class: 'strip', role: 'group', 'aria-labelledby': 'pick-title' });
  let anyOpen = false;
  days.forEach((ymd) => {
    const list = byDate[ymd];
    const open = !!(list && list.some((s) => s.left > 0));
    anyOpen = anyOpen || open;
    const cell = open
      ? el('button', { class: 'day', type: 'button', 'aria-pressed': String(state.date === ymd), 'aria-label': formatDate(ymd) })
      : el('div', { class: list ? 'cell full' : 'cell', title: list ? 'Full' : 'No class' });
    cell.append(el('small', null, weekday(ymd)), el('b', null, String(Number(ymd.slice(8)))));
    if (open) cell.addEventListener('click', () => { state.date = ymd; state.time = null; showError('slot-error', ''); renderPicker(); });
    strip.append(cell);
  });
  box.append(strip);

  if (!anyOpen) {
    box.append(el('p', { class: 'note' }, 'No open classes for this age in the next ' + DAYS_SHOWN + ' days.'));
    return;
  }
  if (!state.date || !byDate[state.date]) {
    box.append(el('p', { class: 'note' }, 'Pick a highlighted day to see class times.'));
    return;
  }

  box.append(el('p', { class: 'times-title' }, formatDate(state.date)));
  const times = el('div', { class: 'chips times', role: 'radiogroup', 'aria-label': 'Class time' });
  byDate[state.date].slice().sort((a, b) => a.time.localeCompare(b.time)).forEach((s) => {
    const label = el('label', { class: 'chip' });
    const input = el('input', { type: 'radio', name: 'slot', value: s.time });
    input.disabled = s.left <= 0;
    input.checked = state.time === s.time;
    input.addEventListener('change', () => { state.time = s.time; showError('slot-error', ''); });
    const span = el('span');
    span.append(document.createTextNode(formatTime(s.time)), el('small', null, spotsText(s.left)));
    label.append(input, span);
    times.append(label);
  });
  box.append(times);
}

function showError(id, text) {
  const node = $(id);
  node.textContent = text;
  node.hidden = !text;
}

/* ---------- Submit ---------- */

function cleanPhone(raw) {
  const trimmed = raw.trim();
  const digits = trimmed.replace(/\D/g, '');
  return (trimmed.startsWith('+') ? '+' : '') + digits;
}

function groupLabel(id) {
  const g = AGE_GROUPS.find((x) => x.id === id);
  return g ? g.label + ' ' + g.hint : '';
}

function showStep(n, focus) {
  state.step = n;
  document.querySelectorAll('[data-step]').forEach((sec) => { sec.hidden = Number(sec.dataset.step) !== n; });
  document.querySelectorAll('#steps li').forEach((li, i) => li.classList.toggle('on', i < n));
  $('step-count').textContent = 'Step ' + n + ' of 2';
  $('step-title').textContent = STEP_TITLES[n - 1];
  if (n === 2 && state.date && state.time) {
    $('summary').textContent = formatDate(state.date) + ', ' + formatTime(state.time);
  }
  if (focus) {
    window.scrollTo(0, 0);
    $('step-title').focus({ preventScroll: true });
  }
}

function fail(node) {
  if (node.focus) node.focus();
  node.scrollIntoView({ block: 'center' });
  return false;
}

function checkDetails() {
  let firstBad = null;
  const name = $('name').value.trim();
  const digits = $('phone').value.replace(/\D/g, '');

  showError('name-error', name ? '' : "Enter your child's name.");
  if (!name) firstBad = firstBad || $('name');

  showError('age-error', state.group ? '' : "Choose your child's age.");
  if (!state.group) firstBad = firstBad || document.querySelector('input[name="age"]');

  const phoneOk = digits.length >= 10 && digits.length <= 15;
  showError('phone-error', phoneOk ? '' : 'Enter a phone number with 10 to 15 digits.');
  if (!phoneOk) firstBad = firstBad || $('phone');

  const slotOk = !!(state.date && state.time);
  showError('slot-error', !state.group || slotOk ? '' : 'Choose a day and a class time.');
  if (!slotOk) firstBad = firstBad || $('picker');

  return firstBad ? fail(firstBad) : true;
}

function checkConfirm() {
  let firstBad = null;
  const email = $('email').value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  showError('email-error', emailOk ? '' : 'Enter an email address, like name@example.com.');
  if (!emailOk) firstBad = firstBad || $('email');

  const agreed = $('agree-setup').checked && $('agree-attend').checked;
  showError('agree-error', agreed ? '' : 'Tick both confirmations to book.');
  if (!agreed) firstBad = firstBad || ($('agree-setup').checked ? $('agree-attend') : $('agree-setup'));

  return firstBad ? fail(firstBad) : true;
}

function next() {
  if (state.step === 1 && checkDetails()) showStep(2, true);
}

function validate() {
  if (state.step !== 1 && !checkDetails()) { showStep(1, false); checkDetails(); return null; }
  if (!checkConfirm()) return null;
  return {
    name: $('name').value.trim(), phone: cleanPhone($('phone').value), email: $('email').value.trim(),
    group: state.group, date: state.date, time: state.time,
    agreeSetup: true, agreeAttend: true, website: $('website').value
  };
}

async function submit(event) {
  event.preventDefault();
  if (state.busy) return;
  if (state.step < 2) { next(); return; }
  const payload = validate();
  if (!payload) return;

  const btn = $('submit');
  state.busy = true;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Booking…';

  let result;
  try {
    if (!SCRIPT_URL) {
      await new Promise((r) => setTimeout(r, 500));
      result = { ok: true };
    } else {
      // text/plain keeps this a "simple" request, which Apps Script web apps need.
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      result = await res.json();
    }
  } catch (err) {
    result = { ok: false, error: 'network' };
  }

  state.busy = false;
  btn.removeAttribute('aria-busy');
  btn.textContent = 'Book class';

  if (result && result.ok) { showDone(payload); return; }

  const messages = {
    full: 'That class just filled up. Pick another time.',
    duplicate: 'This phone number is already booked into that class.',
    closed: "That class is no longer open for booking. Pick another time.",
    invalid: 'Some details look wrong. Check the form and try again.',
    network: "The booking couldn't be sent. Check your connection and try again."
  };
  const code = result && result.error;
  showError('form-error', messages[code] || "The booking didn't go through. Try again in a moment.");

  if (code === 'full' || code === 'closed') {
    const keep = state.group;
    await loadSlots();
    selectGroup(keep);
    showError('form-error', '');
    showStep(1, true);
    showError('slot-error', messages[code]);
  }
}

function showDone(p) {
  const group = AGE_GROUPS.find((g) => g.id === p.group);
  $('form').hidden = true;
  $('done-text').textContent = 'See you there, ' + p.name + '.';
  const dl = $('done-details');
  dl.textContent = '';
  [["Child's age", group.label + ' ' + group.hint], ['Date', formatDate(p.date)], ['Time', formatTime(p.time)]]
    .forEach(([k, v]) => dl.append(el('dt', null, k), el('dd', null, v)));
  $('done').hidden = false;
  $('done').focus();
}

async function reset() {
  $('done').hidden = true;
  $('form').hidden = false;
  document.querySelectorAll('input[name="age"]').forEach((r) => { r.checked = false; });
  $('agree-setup').checked = false;
  $('agree-attend').checked = false;
  state.group = state.date = state.time = null;
  showError('form-error', '');
  renderPicker();
  showStep(1, false);
  $('name').focus();
  await loadSlots();
}

/* ---------- Start ---------- */

renderAges();
$('demo').hidden = !!SCRIPT_URL;
showStep(1, false);
$('form').addEventListener('submit', submit);
$('next1').addEventListener('click', next);
$('back2').addEventListener('click', () => showStep(1, true));
$('again').addEventListener('click', reset);
['agree-setup', 'agree-attend'].forEach((id) => $(id).addEventListener('change', () => showError('agree-error', '')));
['name', 'phone', 'email'].forEach((id) => $(id).addEventListener('input', () => showError(id + '-error', '')));
loadSlots().then(() => { if (state.group) selectGroup(state.group); });
</script>
</body>
</html>
